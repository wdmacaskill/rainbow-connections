<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rainbow Connections</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fff6ec">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rainbow">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800;9..144,900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff6ec; --card:rgba(255,255,255,.78); --card-solid:#fff; --ink:#24202b; --muted:#6d6577;
  --tile:#f1e9dd; --tile-edge:#dccfbd; --ring:#24202b;
  --l0:#f9d64a; --l1:#8fd16a; --l2:#7fb5f0; --l3:#c39bea; --l-ink:#1e1a24;
  --rainbow:linear-gradient(90deg,#ff5f6d,#ffa24c,#ffd84d,#6ed47a,#4fb3ff,#8a7bff,#d77bff,#ff5f6d);
  --blob-a:.42; --radius:16px; --shadow:0 10px 30px -12px rgba(60,30,80,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120f18; --card:rgba(33,29,41,.78); --card-solid:#211d29; --ink:#f3eef8; --muted:#a69eb2;
    --tile:#2c2736; --tile-edge:#1a1621; --ring:#f3eef8;
    --l0:#e8c43a; --l1:#79c057; --l2:#68a1e0; --l3:#b088dc; --blob-a:.28; --shadow:0 10px 30px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#120f18; --card:rgba(33,29,41,.78); --card-solid:#211d29; --ink:#f3eef8; --muted:#a69eb2;
  --tile:#2c2736; --tile-edge:#1a1621; --ring:#f3eef8;
  --l0:#e8c43a; --l1:#79c057; --l2:#68a1e0; --l3:#b088dc; --blob-a:.28; --shadow:0 10px 30px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:0 16px 48px;overflow-x:hidden}
/* drifting rainbow aurora behind everything */
.aurora{position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;filter:blur(60px);opacity:var(--blob-a)}
.aurora i{position:absolute;width:44vmax;height:44vmax;border-radius:50%;animation:drift 26s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:#ff8a94;left:5%;top:0}
.aurora i:nth-child(2){background:#ffd36b;left:55%;top:5%;animation-duration:31s;animation-delay:-6s}
.aurora i:nth-child(3){background:#7fe0a0;left:10%;top:55%;animation-duration:29s;animation-delay:-12s}
.aurora i:nth-child(4){background:#7cc4ff;left:60%;top:50%;animation-duration:34s;animation-delay:-3s}
.aurora i:nth-child(5){background:#c4a2ff;left:35%;top:30%;animation-duration:38s;animation-delay:-18s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(8vmax,-6vmax) scale(1.15)}100%{transform:translate(-6vmax,7vmax) scale(.9)}}
.stripe{height:6px;background:var(--rainbow);background-size:200% 100%;margin:0 -16px;animation:slide 10s linear infinite}
@keyframes slide{to{background-position:200% 0}}
header{max-width:560px;margin:0 auto;padding:20px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:Fraunces,Georgia,serif;font-weight:900;font-size:clamp(28px,7.5vw,40px);margin:0;line-height:1.02;letter-spacing:-.5px;
   background:var(--rainbow);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:slide 12s linear infinite}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
main{max-width:560px;margin:0 auto}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:10px 18px;font-weight:700;transition:transform .12s,box-shadow .12s,opacity .2s}
.btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
.btn:not(:disabled):active{transform:translateY(1px);box-shadow:none}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.3;cursor:default}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;padding:4px}
.hidden{display:none!important}

/* gate */
.gate{margin:10vh auto 0;max-width:380px;text-align:center;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;padding:28px 22px;box-shadow:var(--shadow)}
.gate .bow{width:120px;height:62px;margin:0 auto 6px;display:block}
.gate input{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--tile-edge);background:var(--card-solid);color:var(--ink);margin:14px 0;text-align:center}
.gate input:focus{outline:none;border-color:var(--ink)}
.err{color:#d6455d;min-height:1.4em;font-size:14px;margin-bottom:0}

/* archive */
.statsbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.stat{min-width:0;line-height:1.2;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--muted);box-shadow:var(--shadow)}
.stat b{display:block;font-family:Fraunces,serif;font-size:20px;color:var(--ink);line-height:1.1}
.archive{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.pcard{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:none;border-radius:var(--radius);padding:14px 14px 12px;text-align:left;color:var(--ink);
  box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:104px;transition:transform .18s cubic-bezier(.3,1.6,.6,1);animation:deal .45s backwards;animation-delay:calc(var(--i,0)*25ms)}
.pcard:hover{transform:translateY(-3px) rotate(-.6deg)}
.pcard:nth-child(even):hover{transform:translateY(-3px) rotate(.6deg)}
.pcard::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--rainbow);opacity:.22}
.pcard.won::before{opacity:1}
.pcard.playing::before{opacity:.6}
.pcard.locked{opacity:.7;cursor:default;border:2px dashed var(--tile-edge);background:transparent;box-shadow:none}
.pcard .tag{display:inline-block;white-space:nowrap;font-family:Inter,sans-serif;font-size:11px;font-weight:800;vertical-align:middle;margin-left:8px;padding:2px 8px;border-radius:999px;background:var(--rainbow);background-size:200% 100%;color:#1e1a24;text-transform:uppercase;letter-spacing:.4px}
.pcard .tag.soft{background:var(--tile);color:var(--muted)}
.hero{display:block;width:100%;margin-top:14px;border:none;border-radius:20px;padding:16px 18px;text-align:left;color:#1e1a24;
  background:var(--rainbow);background-size:200% 100%;animation:slide 9s linear infinite;box-shadow:var(--shadow);transition:transform .18s cubic-bezier(.3,1.6,.6,1)}
.hero:hover{transform:translateY(-2px) scale(1.01)}
.hero .hk{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;opacity:.75}
.hero .hn{display:block;font-family:Fraunces,serif;font-weight:900;font-size:30px;line-height:1.1}
.hero .hs{display:block;font-weight:700;font-size:14px}
.packs{justify-content:flex-start;margin:14px 0 0}
.pcard .num{font-family:Fraunces,serif;font-weight:900;font-size:24px}
.pcard .t{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.25}
.pcard .bar{display:flex;gap:3px;margin-top:10px}
.pcard .bar span{flex:1;height:8px;border-radius:4px}
.pcard .meta{margin-top:6px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.pcard .badges{font-size:14px;letter-spacing:1px}

/* game */
.topbar{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.ptitle{font-family:Fraunces,serif;font-weight:900;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{aspect-ratio:1.25/1;border:none;border-radius:12px;background:var(--tile);color:var(--ink);font-weight:800;
  font-size:clamp(10px,3.2vw,16px);text-transform:uppercase;padding:4px;overflow-wrap:anywhere;hyphens:auto;line-height:1.1;letter-spacing:.2px;
  box-shadow:0 4px 0 var(--tile-edge);transition:transform .14s cubic-bezier(.3,1.6,.6,1), background .15s, box-shadow .14s;
  animation:deal .4s backwards;animation-delay:calc(var(--i,0)*22ms)}
.tile.long{font-size:clamp(9px,2.6vw,14px)}.tile.xlong{font-size:clamp(8px,2.2vw,12px)}
.tile:hover{transform:translateY(-2px)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tile-edge)}
@keyframes deal{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:none}}
.tile.m0{background:#ff7b86;--edge:#d95462}.tile.m1{background:#ffb35c;--edge:#d98a33}.tile.m2{background:#5fd39a;--edge:#36a874}
.tile.m3{background:#5cb8ff;--edge:#338fd6}.tile.m4{background:#b48cff;--edge:#8a63d9}
.tile[class*=" m"]{color:#1e1a24;box-shadow:0 4px 0 var(--edge)}
.tile.sel{box-shadow:0 4px 0 var(--edge,var(--tile-edge)), inset 0 0 0 3px var(--ring);transform:translateY(-2px)}
.tile.hop{animation:hop .32s ease both}
@keyframes hop{40%{transform:translateY(-14px)}100%{transform:none}}
.tile.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px) rotate(-2deg)}40%{transform:translateX(6px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.tile{position:relative}
.hintbtn{border:2px solid var(--tile-edge);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;margin-right:6px}
.hintbtn:disabled{opacity:.35}
.tile .pin{position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 2px var(--card-solid);animation:pinpop .5s cubic-bezier(.3,1.8,.6,1)}
@keyframes pinpop{from{transform:scale(0)}to{transform:none}}
.verdict{background:var(--card-solid);border-radius:14px;padding:12px 14px;margin:12px 0 4px;text-align:left}
.vhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.vhead b{font-family:Fraunces,serif;font-size:20px;color:var(--ink);text-transform:none;letter-spacing:0}
.meter{display:flex;gap:3px;margin:8px 0 6px}
.meter span{flex:1;height:7px;border-radius:4px;background:var(--tile)}
.verdict p{margin:6px 0 0;font-size:14px;line-height:1.45}
.verdict .vyou{font-weight:700}
.palette{display:flex;justify-content:center;align-items:center;gap:12px;margin:16px 0 2px}
.pal{width:34px;height:34px;border-radius:50%;border:3px solid var(--bg);padding:0;position:relative;box-shadow:0 0 0 2px transparent;transition:transform .15s cubic-bezier(.3,1.6,.6,1),box-shadow .15s}
.pal.on{box-shadow:0 0 0 2px var(--ink);transform:scale(1.18)}
.pal i{position:absolute;right:-7px;top:-7px;background:var(--ink);color:var(--bg);font-style:normal;font-size:11px;font-weight:800;border-radius:999px;min-width:18px;height:18px;line-height:18px}
.palhint{text-align:center;color:var(--muted);font-size:12px;margin-top:6px}
.solved{border-radius:12px;padding:14px 8px;text-align:center;color:var(--l-ink);margin-bottom:8px;position:relative;overflow:hidden}
.solved.new{animation:land .55s cubic-bezier(.3,1.5,.6,1)}
.solved.new::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);transform:translateX(-100%);animation:sheen .9s .25s ease-out forwards}
@keyframes land{0%{transform:scaleY(.2) scaleX(.9);opacity:0}60%{transform:scaleY(1.08)}100%{transform:none;opacity:1}}
@keyframes sheen{to{transform:translateX(100%)}}
.solved b{display:block;text-transform:uppercase;font-size:15px;letter-spacing:.4px;font-weight:800}
.solved span{font-size:14px;text-transform:uppercase}
.l0{background:var(--l0)}.l1{background:var(--l1)}.l2{background:var(--l2)}.l3{background:var(--l3)}
.mist{text-align:center;margin:16px 0 4px;color:var(--muted);font-size:14px}
.mist i{display:inline-block;width:13px;height:13px;border-radius:50%;margin:0 3px;vertical-align:middle;transition:transform .3s, background .3s}
.mist i.gone{transform:scale(.6)}
.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:30;pointer-events:none;transition:opacity .2s, transform .2s}
.endcard{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px;padding:18px 16px;margin-top:18px;text-align:center;box-shadow:var(--shadow);animation:deal .5s .2s backwards}
.endcard h2{font-family:Fraunces,serif;font-weight:900;margin:0 0 4px;font-size:26px}
.awards{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0 2px}
.award{font-size:13px;font-weight:800;padding:5px 11px;border-radius:999px;color:#1e1a24;background:var(--rainbow);background-size:200% 100%;animation:slide 6s linear infinite}
.award.soft{background:var(--tile);color:var(--ink);animation:none}
.emoji{font-size:22px;line-height:1.15;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.chip{border:2px solid var(--tile-edge);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;transition:transform .12s}
.chip:active{transform:scale(.95)}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
textarea{width:100%;font:inherit;font-size:14px;border-radius:12px;border:2px solid var(--tile-edge);background:var(--card-solid);color:var(--ink);padding:8px;min-height:56px}
.notes{color:var(--muted);font-size:14px;margin-top:8px}
footer{max-width:560px;margin:30px auto 0;color:var(--muted);font-size:13px;text-align:center}

/* celebrations */
#night{position:fixed;inset:0;z-index:39;background:radial-gradient(circle at 50% 30%,#2a1f4a,#0b0814 75%);opacity:0;pointer-events:none;transition:opacity 1.2s}
#night.on{opacity:.82}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:40}
.banner{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:45;pointer-events:auto;cursor:pointer;
  background:radial-gradient(circle at 50% 45%,rgba(18,15,24,.35),rgba(18,15,24,0) 70%);animation:fadeout 3.6s forwards}
.banner svg{width:min(78vw,380px);height:auto;overflow:visible}
.banner svg path{fill:none;stroke-width:15;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;animation:draw .9s cubic-bezier(.4,0,.2,1) forwards}
.banner .big{font-family:Fraunces,serif;font-weight:900;font-size:clamp(34px,10vw,64px);letter-spacing:-1px;margin-top:-6px;text-align:center;line-height:1;
  background:var(--rainbow);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:slide 3s linear infinite, zoomin .6s cubic-bezier(.3,1.6,.6,1) .3s both;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.banner .small{font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);margin-top:8px;animation:zoomin .5s .6s both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes zoomin{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeout{0%,80%{opacity:1}100%{opacity:0;visibility:hidden}}
.shakescreen{animation:screenshake .5s}
@keyframes screenshake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  .banner{animation:fadeout 3.6s forwards!important}
}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<div class="stripe"></div>
<header>
  <div><h1>Rainbow Connections</h1><p class="sub">Four groups of four. For Will &amp; Holly.</p></div>
  <button id="homeBtn" class="btn hidden" aria-label="Back to archive">Archive</button>
</header>
<main>
  <section id="gate" class="gate">
    <svg class="bow" viewBox="0 0 120 62" aria-hidden="true">
      <g fill="none" stroke-width="7" stroke-linecap="round">
        <path d="M8 58a52 52 0 0 1 104 0" stroke="#ff5f6d"/><path d="M16 58a44 44 0 0 1 88 0" stroke="#ffa24c"/>
        <path d="M24 58a36 36 0 0 1 72 0" stroke="#ffd84d"/><path d="M32 58a28 28 0 0 1 56 0" stroke="#6ed47a"/>
        <path d="M40 58a20 20 0 0 1 40 0" stroke="#4fb3ff"/><path d="M48 58a12 12 0 0 1 24 0" stroke="#8a7bff"/>
      </g></svg>
    <p style="margin:0">Enter the passphrase.</p>
    <form id="gateForm"><input id="pw" type="password" autocomplete="current-password" placeholder="passphrase" autofocus>
    <button class="btn primary" type="submit">Unlock</button></form>
    <p class="err" id="gateErr"></p>
  </section>

  <section id="archiveView" class="hidden">
    <div class="statsbar" id="stats"></div>
    <div id="hero"></div>
    <div class="chips packs" id="packs"></div>
    <div class="archive" id="archive"></div>
  </section>

  <section id="gameView" class="hidden">
    <div class="topbar"><div class="ptitle" id="ptitle"></div><div><button class="hintbtn" id="hintBtn">💡 Hint</button><button class="linkbtn" id="resetBtn">Restart</button></div></div>
    <div id="solvedRows"></div>
    <div class="grid" id="grid"></div>
    <div id="palWrap"><div class="palette" id="palette"></div>
    <div class="palhint">Pick a colour, then tap tiles. Submit sends the four tiles in the chosen colour.</div></div>
    <div class="mist" id="mist"></div>
    <div class="controls" id="controls">
      <button class="btn" id="shuffleBtn">Shuffle</button>
      <button class="btn" id="clearBtn">Deselect</button>
      <button class="btn primary" id="submitBtn" disabled>Submit</button>
    </div>
    <div id="end"></div>
  </section>
</main>
<footer id="foot" class="hidden">
  <button class="linkbtn" id="exportBtn">Copy ratings for Claude</button> ·
  <button class="linkbtn" id="themeBtn">Light/dark</button> ·
  <button class="linkbtn" id="lockBtn">Lock</button>
  <div id="syncState" style="margin-top:6px;font-size:12px"></div>
</footer>
<div id="night" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="toast hidden" id="toast"></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const MAX_MISTAKES = 4;
const DOT = ['🟨','🟩','🟦','🟪'];
const LV = ['#f9d64a','#8fd16a','#7fb5f0','#c39bea'];
const TAGS = ['Fun','Too easy','About right','Too hard','A group felt unfair','Loved the wordplay'];
let PUZZLES = [], cur = null, sel = [], order = [], marks = {}, active = 0, busy = false, justSolved = null, dealt = false;
const MARKS = ['#ff7b86','#ffb35c','#5fd39a','#5cb8ff','#b48cff'];
const syncSel = () => { sel = Object.keys(marks).filter(w => marks[w] === active); };
const saveMarks = () => { const m = store.get('rc-marks', {}); m[cur.id] = marks; store.set('rc-marks', m); };
const wait = ms => new Promise(r => setTimeout(r, ms));

// theme
const theme = store.get('rc-theme', null);
if (theme) document.documentElement.dataset.theme = theme;
$('themeBtn').onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  const t = dark ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; store.set('rc-theme', t);
};

// ---------- particle effects ----------
const FX = (() => {
  const cv = $('fx'), cx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let parts = [], rockets = [], raf = 0, W = 0, H = 0;
  const COLS = ['#ff5f6d','#ffa24c','#ffd84d','#6ed47a','#4fb3ff','#8a7bff','#d77bff'];
  const pick = a => a[Math.random() * a.length | 0];
  const R = (a, b) => a + Math.random() * (b - a);
  function size(){ const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); }
  size(); addEventListener('resize', size);
  function kick(){ if (!raf) raf = requestAnimationFrame(tick); }
  function confetti(x, y, n, o = {}){
    if (reduce) n = Math.min(n, 12);
    const {angle = -Math.PI / 2, spread = Math.PI * 2, speed = 10, colors = COLS} = o;
    for (let i = 0; i < n; i++){
      const a = angle + (Math.random() - .5) * spread, v = speed * R(.35, 1.15);
      parts.push({k: Math.random() < .22 ? 'c' : 'r', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: .24, drag: .984,
        life: 1, decay: R(.004, .009), rot: R(0, 6.3), vr: R(-.3, .3), w: R(6, 12), h: R(4, 8), c: pick(colors), wob: R(0, 6.3)});
    }
    kick();
  }
  function sparks(x, y, n, colors, speed = 5){
    for (let i = 0; i < n; i++){
      const a = (i / n) * Math.PI * 2 + R(-.08, .08), v = speed * R(.55, 1.05);
      parts.push({k: 's', x, y, px: x, py: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: .06, drag: .975,
        life: 1, decay: R(.011, .02), c: pick(colors), tw: Math.random() < .3});
    }
    kick();
  }
  function rocket(colors){
    rockets.push({x: R(W * .15, W * .85), y: H + 10, vx: R(-1, 1), vy: -R(H * .016, H * .021) - 6, ty: R(H * .12, H * .42),
      c: colors || [pick(COLS), pick(COLS)]});
    kick();
  }
  function rain(n, colors){
    for (let i = 0; i < n; i++)
      parts.push({k: Math.random() < .5 ? 'c' : 'r', x: R(0, W), y: R(-H * .6, -10), vx: R(-1, 1), vy: R(1, 4), g: .05, drag: .99,
        life: 1, decay: R(.0025, .005), rot: R(0, 6.3), vr: R(-.2, .2), w: R(6, 11), h: R(4, 7), c: pick(colors || COLS), wob: R(0, 6.3)});
    kick();
  }
  function tick(){
    raf = -1;
    cx.clearRect(0, 0, W, H);
    for (const r of rockets){
      r.px = r.x; r.py = r.y; r.x += r.vx; r.y += r.vy; r.vy += .18;
      cx.strokeStyle = '#fff6d0'; cx.lineWidth = 2.5; cx.globalAlpha = .9;
      cx.beginPath(); cx.moveTo(r.px, r.py + 8); cx.lineTo(r.x, r.y); cx.stroke();
      if (Math.random() < .5) parts.push({k: 's', x: r.x, y: r.y, px: r.x, py: r.y, vx: R(-.5, .5), vy: R(0, 1), g: .04, drag: .96, life: .7, decay: .04, c: '#ffe9a8'});
      if (r.y <= r.ty || r.vy >= -1.5){ r.dead = true; sparks(r.x, r.y, 80, r.c, R(4.5, 6.5)); sparks(r.x, r.y, 24, ['#ffffff'], 2.2); }
    }
    rockets = rockets.filter(r => !r.dead);
    for (const p of parts){
      p.px = p.x; p.py = p.y;
      p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; p.x += p.vx; p.y += p.vy; p.life -= p.decay;
      if (p.y > H + 30) p.life = 0;
      if (p.life <= 0) continue;
      cx.globalAlpha = Math.min(1, p.life * 1.6);
      if (p.k === 's'){
        if (p.tw && Math.random() < .3) continue;
        cx.strokeStyle = p.c; cx.lineWidth = 2.2; cx.beginPath();
        cx.moveTo(p.px - p.vx * 2, p.py - p.vy * 2); cx.lineTo(p.x, p.y); cx.stroke();
      } else {
        p.rot += p.vr; p.wob += .12; cx.fillStyle = p.c;
        cx.save(); cx.translate(p.x + Math.sin(p.wob) * 2, p.y); cx.rotate(p.rot);
        if (p.k === 'c'){ cx.beginPath(); cx.arc(0, 0, p.h / 2, 0, 7); cx.fill(); }
        else cx.fillRect(-p.w / 2, -p.h / 2 * Math.abs(Math.cos(p.wob)), p.w, p.h * Math.abs(Math.cos(p.wob)) + .5);
        cx.restore();
      }
    }
    cx.globalAlpha = 1;
    parts = parts.filter(p => p.life > 0);
    raf = (parts.length || rockets.length) ? requestAnimationFrame(tick) : 0;
  }
  return {
    burstAt(el, color){ const b = el.getBoundingClientRect(); confetti(b.left + b.width / 2, b.top + b.height / 2, 34, {speed: 7, colors: [color, color, '#ffffff']}); },
    pop(){ confetti(W / 2, H * .45, 120, {speed: 12}); },
    cannons(volleys = 3){
      for (let v = 0; v < volleys; v++) setTimeout(() => {
        confetti(-10, H * .85, 90, {angle: -Math.PI / 3.2, spread: .7, speed: R(17, 23)});
        confetti(W + 10, H * .85, 90, {angle: -Math.PI + Math.PI / 3.2, spread: .7, speed: R(17, 23)});
      }, v * 420);
    },
    fireworks(seconds = 5, colors, dark){
      if (reduce) return this.pop();
      if (dark){ const n = $('night'); n.classList.add('on'); clearTimeout(n._t); n._t = setTimeout(() => n.classList.remove('on'), seconds * 1000 + 1200); }
      const n = Math.round(seconds * 3.2);
      for (let i = 0; i < n; i++) setTimeout(() => rocket(colors && [pick(colors), pick(colors)]), i * (seconds * 1000 / n) + R(0, 200));
    },
    rain(n, colors){ rain(reduce ? 15 : n, colors); },
    drizzle(){ rain(40, ['#9aa3b2', '#b8c0cc', '#7d8696']); }
  };
})();

// ---------- decryption ----------
const norm = s => s.trim().toLowerCase().replace(/\s+/g,' ');
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const enc = await (await fetch('puzzles.enc.json', {cache:'no-store'})).json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(pw)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(enc.salt), iterations:enc.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(enc.iv)}, key, b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(pw, silent){
  try{
    const data = await decrypt(pw);
    PUZZLES = (Array.isArray(data) ? data : data.puzzles).sort((a,b)=>a.id-b.id);
    SYNC = Array.isArray(data) ? null : (data.sync || null);
    migrate();
    store.set('rc-pw', norm(pw));
    $('gate').classList.add('hidden'); $('foot').classList.remove('hidden');
    route();
    if (SYNC) Sync.refresh();
  }catch(e){
    if (!silent){ $('gateErr').textContent = 'That isn’t it. Try again.'; $('gate').classList.remove('shakescreen'); void $('gate').offsetWidth; $('gate').classList.add('shakescreen'); }
    store.del('rc-pw');
  }
}

// ---------- cross-device sync (shared progress + ratings in a private GitHub repo) ----------
let SYNC = null;
const Sync = (() => {
  let sha = null, timer = null, busyS = false, again = false;
  const url = () => `https://api.github.com/repos/${SYNC.repo}/contents/${SYNC.path || 'state.json'}`;
  const hdr = () => ({Authorization: 'Bearer ' + SYNC.token, Accept: 'application/vnd.github+json'});
  const status = t => { const e = $('syncState'); if (e) e.textContent = t; };
  const newer = (a, b, k) => (b && (!a || (b[k] || 0) > (a[k] || 0))) ? b : a;
  function merge(remote){
    const P = prog(), R = store.get('rc-ratings', {});
    let changed = false;
    for (const id in remote.progress || {}){ const m = newer(P[id], remote.progress[id], 'rev'); if (m !== P[id]){ P[id] = m; changed = true; } }
    for (const id in remote.ratings || {}){ const m = newer(R[id], remote.ratings[id], 'ts'); if (m !== R[id]){ R[id] = m; changed = true; } }
    store.set('rc-progress', P); store.set('rc-ratings', R);
    return changed;
  }
  async function pull(){
    const r = await fetch(url() + '?t=' + Date.now(), {headers: hdr(), cache: 'no-store'});
    if (r.status === 404){ sha = null; return false; }
    if (!r.ok) throw new Error('pull ' + r.status);
    const j = await r.json(); sha = j.sha;
    const txt = new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g, '')), c => c.charCodeAt(0)));
    return merge(JSON.parse(txt || '{}'));
  }
  async function push(){
    const body = JSON.stringify({progress: prog(), ratings: store.get('rc-ratings', {}), updated: new Date().toISOString()});
    const bytes = new TextEncoder().encode(body); let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
    const r = await fetch(url(), {method: 'PUT', headers: hdr(), body: JSON.stringify({message: 'sync', content: btoa(bin), ...(sha ? {sha} : {})})});
    if (!r.ok) throw new Error('push ' + r.status);
    sha = (await r.json()).content.sha;
  }
  async function run(doPush){
    if (!SYNC) return false;
    if (busyS){ again = again || doPush; return false; }
    busyS = true; status('Syncing…');
    let changed = false;
    try{
      changed = await pull();
      if (doPush){ try{ await push(); } catch(e){ await pull(); await push(); } }
      status('Synced ✓');
    }catch(e){ status('Offline: will sync later'); }
    busyS = false;
    if (again){ again = false; setTimeout(() => run(true), 300); }
    return changed;
  }
  return {
    soon(){ if (!SYNC) return; clearTimeout(timer); timer = setTimeout(() => run(true), 1200); },
    async refresh(){ if (await run(false)){ if (!cur) showArchive(); } }
  };
})();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && PUZZLES.length) Sync.refresh(); });

const today = () => new Date().toLocaleDateString('en-CA');
const dayAdd = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toLocaleDateString('en-CA'); };

function streaks(all){
  const days = new Set(Object.values(all).filter(s => s.status === 'won' && s.finishedAt).map(s => s.finishedAt));
  let cur = 0, d = days.has(today()) ? today() : dayAdd(today(), -1);
  while (days.has(d)){ cur++; d = dayAdd(d, -1); }
  let best = 0, run = 0, prev = null;
  for (const x of [...days].sort()){ run = prev && dayAdd(prev, 1) === x ? run + 1 : 1; best = Math.max(best, run); prev = x; }
  return {cur, best, playedToday: days.has(today())};
}

// ---------- game ----------
function seeded(n){ let s = n * 9301 + 49297; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
// Opening grid, NYT-style: an authored `start` order if the puzzle has one; otherwise a seeded deal
// where every row holds one word from each group, so no row hands you a pair.
function dealOrder(p){
  const all = p.groups.flatMap(g => g.words);
  if (Array.isArray(p.start) && p.start.length === 16 && all.every(w => p.start.includes(w))) return p.start.slice();
  const rnd = seeded(p.id), rows = [[],[],[],[]];
  shuffle(p.groups, rnd).forEach(g => shuffle(g.words, rnd).forEach((w, r) => rows[r].push(w)));
  return shuffle(rows, rnd).flatMap(r => shuffle(r, rnd));
}
function shuffle(a, rnd=Math.random){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function openPuzzle(p){
  cur = p; active = 0; busy = false; justSolved = null; dealt = false;
  marks = store.get('rc-marks', {})[p.id] || {}; syncSel();
  $('archiveView').classList.add('hidden'); $('gameView').classList.remove('hidden'); $('homeBtn').classList.remove('hidden');
  order = dealOrder(p);
  render(); window.scrollTo(0,0);
}
function groupOf(w){ return cur.groups.find(g => g.words.includes(w)); }
function render(){
  const st = getP(cur.id);

  }).join('');
  const remaining = order.filter(w => !solvedLevels.includes(groupOf(w).level));

    `<i class="${i < left ? '' : 'gone'}" style="background:${i < left ? ['#ff5f6d','#ffd84d','#4fb3ff','#8a7bff'][i] : 'var(--tile)'}"></i>`).join('');

  if (done) wireEnd();
  if (justSolved !== null){
    const row = document.querySelector(`.solved[data-l="${justSolved}"]`);
    if (row) setTimeout(() => FX.burstAt(row, LV[justSolved]), 120);
    justSolved = null;
  }
}
function hintWord(g){ const h = cur.hints && cur.hints[g.level]; return h && g.words.includes(h) ? h : g.words[0]; }
// Hint entries are words; old saves stored a level number, meaning that group's anchor word.
function hintWords(st){ return (st.hints||[]).map(h => typeof h === 'number' ? hintWord(cur.groups.find(x => x.level === h)) : h); }
function hintOrder(g){ const a = hintWord(g); return [a, ...g.words.filter(w => w !== a)]; }
// Round robin: first the anchor of each unsolved group (easiest first), then a second word of each, up to all four.
function nextHint(st){
  const have = new Set(hintWords(st)), gs = cur.groups.slice().sort((a, b) => a.level - b.level).filter(g => !st.solved.includes(g.level));
  for (let k = 0; k < 4; k++) for (const g of gs){ const w = hintOrder(g)[k]; if (!have.has(w)) return w; }
  return null;
}
$('hintBtn').onclick = () => {
  if (busy) return;
  const st = getP(cur.id); st.hints = st.hints || [];
  const w = nextHint(st);
  if (!w) return;
  st.hints.push(w); st.status = 'playing'; saveP(cur.id, st); render();
  const t = [...document.querySelectorAll('.tile')].find(x => x.dataset.w === w); if (t) FX.burstAt(t, LV[groupOf(w).level]);
};
function toggle(w){
  if (busy) return;
  if (marks[w] === active) delete marks[w]; else marks[w] = active;
  syncSel(); saveMarks(); render();
}
$('shuffleBtn').onclick = () => { if (busy) return; order = shuffle(order); dealt = false; render(); };
$('clearBtn').onclick = () => { if (busy) return; for (const w of sel) delete marks[w]; syncSel(); saveMarks(); render(); };
$('resetBtn').onclick = () => {
  if (!confirm('Restart this puzzle? Your progress on it will be cleared.')) return;
  saveP(cur.id, {solved:[], mistakes:0, guesses:[], status:'new'}); marks = {}; saveMarks(); syncSel(); dealt = false; render();
};
$('submitBtn').onclick = async () => {
  if (sel.length !== 4 || busy) return;
  const st = getP(cur.id);
  const key = sel.slice().sort().join('|');
  if (st.guesses.some(g => g.slice().sort().join('|') === key)){ toast('Already guessed!'); return; }
  busy = true; $('submitBtn').disabled = true;
  const tiles = [...document.querySelectorAll('.tile')].filter(t => sel.includes(t.dataset.w));
  tiles.forEach((t, i) => { t.style.animation = ''; t.style.animationDelay = (i * 90) + 'ms'; t.classList.add('hop'); });
  await wait(tiles.length * 90 + 320);
  busy = false;
  st.guesses.push(sel.slice()); st.status = 'playing';
  const g = groupOf(sel[0]);
  if (sel.every(w => groupOf(w) === g)){
    st.solved.push(g.level); for (const w of g.words) delete marks[w]; syncSel(); saveMarks();
    justSolved = g.level;
    if (st.solved.length === 4){ st.status = 'won'; st.finishedAt = today(); }
    saveP(cur.id, st); render();
    if (st.status === 'won') setTimeout(() => celebrate(st), 450);
  } else {
    const counts = {}; sel.forEach(w => { const l = groupOf(w).level; counts[l] = (counts[l]||0)+1; });
    const oneAway = Object.values(counts).includes(3);
    st.mistakes++;
    if (st.mistakes >= MAX_MISTAKES){ st.status = 'lost'; st.finishedAt = today(); }
    saveP(cur.id, st);
    tiles.forEach(t => { t.classList.remove('hop'); t.style.animationDelay = '0ms'; void t.offsetWidth; t.classList.add('shake'); });
    try{ navigator.vibrate && navigator.vibrate(120); }catch(e){}
    toast(st.status === 'lost' ? 'Next time!' : (oneAway ? 'One away…' : 'Not quite'));
    busy = true;
    await wait(420); busy = false;
    if (st.status === 'lost'){ marks = {}; saveMarks(); syncSel(); }
    render();
    if (st.status === 'lost') setTimeout(() => celebrate(st), 300);
  }
};
function emojiGrid(st){
  return st.guesses.map(g => g.map(w => DOT[groupOf(w).level]).join('')).join('\n');
}
function endCard(st){
  const r = store.get('rc-ratings', {})[cur.id] || {tags:[], comment:''};
  const aw = awards(st);
  const head = st.status !== 'won' ? '☁️ Out of guesses' : (st.hints||[]).length ? 'Solved!' : ['Perfect!','Splendid!','Great!','Phew!'][Math.min(st.mistakes,3)];
  return `<div class="endcard">
    <h2>${head}</h2>
    ${aw.length ? `<div class="awards">${aw.map(x => `<span class="award${/everse|Perfect/.test(x) ? '' : ' soft'}">${BADGE[x]} ${x}</span>`).join('')}</div>` : ''}
    <div class="emoji">${emojiGrid(st).replace(/\n/g,'<br>')}</div>
    ${(st.hints||[]).length ? `<p class="notes" style="margin-top:0">💡 ${st.hints.length} hint${st.hints.length > 1 ? 's' : ''} used</p>` : ''}
    ${cur.assessment ? verdict(st) : (cur.notes ? `<p class="notes">${esc(cur.notes)}</p>` : '')}
    <p style="margin:14px 0 0;font-weight:700">How was it?</p>
    <div class="chips">${TAGS.map(t => `<button class="chip${r.tags.includes(t)?' on':''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    <textarea id="comment" placeholder="Anything else? (which group, what was unfair…)">${esc(r.comment||'')}</textarea>
    <div class="controls">
      ${st.status === 'won' ? '<button class="btn" id="againBtn">🎉 Again</button>' : ''}
      <button class="btn" id="copyRes">Copy result</button>
      <button class="btn primary" id="nextBtn">Next puzzle</button>
    </div>
  </div>`;
}
function verdict(st){
  const a = cur.assessment, m = st.mistakes, h = (st.hints||[]).length, hard = a.score >= 7, mid = a.score >= 5;
  let line;
  if (st.status !== 'won') line = hard ? 'No shame in that: it was built to bamboozle.' : 'This one got away from you. It happens.';
  else if (!m && !h) line = hard ? 'You made a fiendish one look easy. I’m impressed.' : mid ? 'A clean sweep. Nicely done.' : 'A clean sweep, as it should be.';
  else if (m + h >= 3) line = hard ? 'A hard-fought win on a hard puzzle. That counts double.' : 'You found it harder than I predicted.';
  else line = hard ? 'Better than I expected on a puzzle this tricky.' : 'About what I expected.';
  const cols = ['#ff5f6d','#ff7f5a','#ffa24c','#ffc54d','#ffd84d','#9fd86a','#6ed47a','#4fb3ff','#8a7bff','#d77bff'];
  return `<div class="verdict"><div class="vhead"><span>Claude’s verdict</span><b>${a.score}/10 · ${esc(a.label)}</b></div>
    <div class="meter">${cols.map((c, i) => `<span style="${i < a.score ? 'background:' + c : ''}"></span>`).join('')}</div>
    <p>${esc(a.text)}</p><p class="vyou">${line}</p></div>`;
}
function saveRating(mut){
  const all = store.get('rc-ratings', {}); const r = all[cur.id] || {tags:[], comment:''};
  mut(r); r.ts = new Date().toISOString(); all[cur.id] = r; store.set('rc-ratings', all); Sync.soon();
}
function wireEnd(){
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    const t = c.dataset.tag;
    saveRating(r => { r.tags = r.tags.includes(t) ? r.tags.filter(x=>x!==t) : [...r.tags, t]; });
    c.classList.toggle('on');
  });
  $('comment').oninput = e => saveRating(r => { r.comment = e.target.value; });
  if ($('againBtn')) $('againBtn').onclick = () => celebrate(getP(cur.id));
  $('copyRes').onclick = () => copy(`Rainbow Connections #${cur.id}${(getP(cur.id).hints||[]).length ? ' 💡' + getP(cur.id).hints.length : ''}\n` + emojiGrid(getP(cur.id)));
  $('nextBtn').onclick = () => {
    const all = prog();
    const U = PUZZLES.filter(unlocked);
    const nxt = U.find(p => p.id > cur.id && !['won','lost'].includes((all[p.id]||{}).status))
             || U.find(p => !['won','lost'].includes((all[p.id]||{}).status));
    location.hash = nxt ? 'p' + nxt.id : '';
  };
}
$('exportBtn').onclick = () => {
  const ratings = store.get('rc-ratings', {}), all = prog();
  const out = Object.keys({...ratings, ...all}).sort((a,b)=>a-b).map(id => ({
    id:+id, status:(all[id]||{}).status, mistakes:(all[id]||{}).mistakes, order:(all[id]||{}).solved, hints:((all[id]||{}).hints||[]).length, ...(ratings[id]||{})
  }));
  copy('Rainbow Connections feedback:\n' + JSON.stringify(out, null, 1));
};
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast('Copied'); }
  catch(e){ prompt('Copy this:', text); }
}
let tt;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); t.style.opacity = 1;
  clearTimeout(tt); tt = setTimeout(() => { t.style.opacity = 0; setTimeout(()=>t.classList.add('hidden'),200); }, 1400); }

// preview celebrations from the console: rcDemo("perfectreverse"), "reverse", "perfect", "purple", "won", "lost"
window.rcDemo = kind => celebrate({status: kind === 'lost' ? 'lost' : 'won', mistakes: kind === 'perfect' || kind === 'perfectreverse' ? 0 : 1,
  solved: kind.includes('reverse') ? [3,2,1,0] : kind === 'purple' ? [3,0,1,2] : [0,1,2,3]});

// boot
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
const saved = store.get('rc-pw', null);
if (saved) unlock(saved, true);
})();
</script>
